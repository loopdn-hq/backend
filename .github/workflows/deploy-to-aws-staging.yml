name: Deploy to AWS Loopd Staging

# Adding production later is a copy of this file with the branch, the
# `environment:`, and the five identifiers under `env:` changed. Nothing else
# differs - the AWS side is the same stack with different numbers.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  # Two deploys racing would have ECS updating the service from under a
  # migration that is still running.
  group: deploy-staging
  cancel-in-progress: false

env:
  ENVIRONMENT: staging
  ECR_REPOSITORY: loopd/staging/base
  ECS_CLUSTER: ecs-loopd-staging
  ECS_SERVICE: svc-ecs-loopd-staging-api
  CONTAINER_NAME: image-loopd-staging-api

jobs:
  # Runs before anything is built, so a failing suite never reaches ECR.
  # No services needed: the tests fall back to SQLite and the in-memory channel
  # layer when POSTGRES_DB and REDIS_URL are unset.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --verbosity 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: aws-staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: v${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The tasks run on Graviton, which is 20% cheaper than x86 Fargate. This
      # repository is private, so GitHub's arm64 runners are not included in the
      # free allotment - QEMU on a standard runner is the cheaper trade. Nothing
      # compiles during the build (every pinned dependency ships an aarch64
      # manylinux wheel), so emulation costs a few minutes, not an hour.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker_context/staging/Dockerfile
          platforms: linux/arm64
          push: true
          # Three tags for three jobs: the run number is what a human reads, the
          # commit sha is what makes a rollback unambiguous, and `latest` is
          # what the terraform-created task definition points at on first apply.
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Buildx would otherwise push an OCI image index carrying provenance
          # attestations, which Fargate refuses to pull.
          provenance: false

      # Pulls the live task definition and swaps only the image. Environment and
      # secrets stay exactly as terraform defined them, so CI never has to
      # restate the SSM wiring and the two cannot drift.
      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: arn:aws:ecs:${{ vars.AWS_REGION }}:${{ secrets.ACCOUNT_ID }}:task-definition/${{ env.ECS_SERVICE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register task definition
        id: register
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.taskdef.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # Migrations run once, here, as a one-off task on the new image - before
      # the service is updated. docker-compose-staging.yml warns why: concurrent
      # `migrate` calls race each other once there is more than one replica.
      #
      # The network configuration is read back off the running service rather
      # than restated as repository variables, so it cannot drift from terraform.
      - name: Run database migrations
        run: |
          set -euo pipefail

          NETCFG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          echo ">> Starting migration task"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --started-by "gha-${{ github.run_id }}-migrate" \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task did not return a task ARN"
            exit 1
          fi
          echo ">> $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          echo ">> ---- migration output ----"
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events \
            --log-group-name "/ecs/${ECS_CLUSTER}/${CONTAINER_NAME}" \
            --log-stream-name "ecs/${CONTAINER_NAME}/${TASK_ID}" \
            --query 'events[].message' --output text 2>/dev/null || \
            echo "(log stream not available yet)"
          echo ">> ---------------------------"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migrations failed (exit ${EXIT_CODE}): ${REASON}"
            exit 1
          fi
          echo ">> Migrations applied"

      - name: Deploy to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --query 'service.serviceName' --output text

      # The Elated workflow sets wait-for-service-stability to false, which
      # reports green the moment ECS accepts the new definition - a
      # crash-looping image passes.
      #
      # Waiting is necessary but not sufficient. `wait services-stable` succeeds
      # as soon as there is one deployment with runningCount == desiredCount,
      # and it inspects neither rolloutState nor which task definition won. When
      # the circuit breaker rolls a bad image back, the service settles on the
      # PREVIOUS revision and the waiter returns 0 - so the run would go green
      # having deployed nothing. The assertion after it is what closes that.
      - name: Wait for the service to stabilise
        run: |
          set -euo pipefail

          WAIT_RC=0
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" || WAIT_RC=$?

          READ=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].{td:taskDefinition,state:deployments[0].rolloutState,reason:deployments[0].rolloutStateReason}' \
            --output json)
          LIVE_TD=$(echo "$READ" | python3 -c 'import json,sys; print(json.load(sys.stdin)["td"])')
          STATE=$(echo "$READ"  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state") or "")')
          REASON=$(echo "$READ" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("reason") or "")')

          echo ">> rolloutState : ${STATE}"
          echo ">> running      : ${LIVE_TD}"
          echo ">> expected     : ${{ steps.register.outputs.arn }}"

          if [ "$WAIT_RC" -ne 0 ] || [ "$LIVE_TD" != "${{ steps.register.outputs.arn }}" ] || [ "$STATE" != "COMPLETED" ]; then
            echo "::error::Deploy did not take. ${REASON}"
            echo ">> ---- recent service events ----"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].events[:10].message' --output text
            exit 1
          fi

          echo ">> Deployed ${{ github.sha }}"
